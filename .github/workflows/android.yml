name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Allows running the build manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Debug build: signed with the standard debug key, so it installs directly on a phone.
      # It uses the ".debug" package suffix, so it installs next to the original app.
      - name: Build installable APK (full flavor, debug)
        run: ./gradlew assembleFullDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AEE-debug-${{ env.date_today }}
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
